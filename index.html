<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>カロリー管理アプリ</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1>カロリー管理アプリ</h1>


<h2>基本情報</h2>

<select id="gender">
<option value="male">男性</option>
<option value="female">女性</option>
</select>


<input id="age" type="number" placeholder="年齢">

<input id="height" type="number" placeholder="身長(cm)">

<input id="weight" type="number" placeholder="体重(kg)">


<button onclick="setTarget()">
目標カロリー設定
</button>



<h2>残りカロリー</h2>

<div class="gauge">

<div id="bar"></div>

</div>


<div id="remain">
設定してください
</div>



<h2>食べ物</h2>

<div id="menuButtons"></div>



<h2>食事履歴</h2>

<div id="list"></div>



<button class="reset" onclick="resetFood()">
リセット
</button>


</div>


<script src="app.js"></script>

</body>

</html>
